name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ios-trigger.txt'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_PEM: ${{ secrets.IOS_DIST_CERT_PEM }}
          IOS_DIST_KEY_PEM: ${{ secrets.IOS_DIST_KEY_PEM }}
        run: |
          echo "$IOS_DIST_CERT_PEM" > cert.pem
          echo "$IOS_DIST_KEY_PEM" > key.pem
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.pem -k build.keychain -T /usr/bin/codesign
          security import key.pem -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Prepare App Store Connect API key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8

      - name: Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Manual signing with the App Store distribution profile. Automatic
          # signing needs a registered device, so the profile is provided by
          # CI secrets; regenerate it after enabling new capabilities (Push).
          # 簽署設定（CODE_SIGN_STYLE / PROVISIONING_PROFILE_SPECIFIER）放喺
          # project.pbxproj 的 App target，避免 CLI 參數套用到 SPM 插件 target。
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee /tmp/archive.log || {
              SUMMARY=$(grep -iE "error:|doesn't include|no profiles|requires a|Provisioning" /tmp/archive.log \
                | head -6 | tr '\n' ' ' | cut -c1-900 | tr '"' "'")
              echo "::error title=xcodebuild archive failed::${SUMMARY}"
              {
                echo "## xcodebuild archive failed"
                echo '```'
                grep -iE "error:|failed|doesn't include|requires|profile" /tmp/archive.log | tail -40
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.lifenum.wuxing</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee /tmp/export.log || {
              {
                echo "## exportArchive failed"
                echo '```'
                tail -60 /tmp/export.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Upload to TestFlight
        if: ${{ env.APPSTORE_API_KEY_ID != '' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          xcrun altool --upload-app \
            -f build/ipa/App.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
